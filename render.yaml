services:
  - type: web
    name: papertrace-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papertrace-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AGENT_EMBEDDED_WORKER
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.10

  - type: worker
    name: papertrace-agent-worker
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m agent.worker
    autoDeploy: true
    maxShutdownDelaySeconds: 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papertrace-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: AGENT_EMBEDDED_WORKER
        value: "false"
      - key: AGENT_WORKER_POLL_SECONDS
        value: "1"
      - key: AGENT_SCHEMA_WAIT_SECONDS
        value: "120"
      - key: PYTHON_VERSION
        value: 3.11.10

databases:
  - name: papertrace-db
    plan: basic-256mb
    region: singapore
    databaseName: papertrace
    user: papertrace
    postgresMajorVersion: "18"
    ipAllowList: []
