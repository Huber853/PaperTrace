name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend and offline evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AGENT_EMBEDDED_WORKER: "false"
      DEEPSEEK_API_KEY: test-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -v
      - run: python -m evals.runner --suite smoke --output evals/reports
      - run: python -m evals.runner --suite relations --output evals/reports
      - run: python -m compileall .
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-eval-reports
          path: backend/evals/reports
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
